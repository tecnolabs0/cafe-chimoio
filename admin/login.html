<!DOCTYPE html>
<html lang="pt-MZ">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin | Café Chimoio</title>

    <link
        rel="stylesheet"
        href="/admin/css/login.css"
    >

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                ☕
            </div>

            <h1>
                Café Chimoio
            </h1>

            <p class="subtitle">
                Área administrativa
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@cafechimoio.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Entrar no painel
                </button>

            </form>


            <div class="login-footer">
                Sistema administrativo
            </div>

        </div>

    </main>


    <script src="/admin/js/login.js"></script>

</body>

</html>
